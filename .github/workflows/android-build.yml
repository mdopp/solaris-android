# CI for the standalone Solaris widgets app (plain Gradle, no Bubblewrap).
#
# - Every push/PR to main: a debug build proves the project COMPILES.
# - A tag `v*`: a release-signed APK + AAB, when the keystore secrets are present.
#   The signing keystore is injected from a CI secret (never committed).
#
# Required repo secrets for signed releases:
#   ANDROID_KEYSTORE_BASE64    - `base64 -w0 android.keystore`
#   ANDROID_KEYSTORE_PASSWORD  - the store/key password
# (key alias defaults to `solaris`.)

name: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the tag build can create a GitHub Release and attach the
    # signed APK/AAB (softprops/action-gh-release). Without it the attach step
    # fails with "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Compile check on every push/PR.
      - name: Build debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # Signed release only on a tag, and only when the keystore secret exists.
      # NOTE: the `secrets` context is NOT allowed inside an `if:` expression
      # (GitHub: "Unrecognized named-value: 'secrets'"), so we surface its presence
      # via a step output and gate the signing steps on that instead.
      - name: Detect keystore secret
        id: keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Decode keystore
        if: steps.keystore.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release (APK + AAB)
        if: steps.keystore.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: solaris
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Attach APK/AAB to the release
        if: steps.keystore.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solaris-android
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
