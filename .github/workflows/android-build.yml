# CI skeleton for the Solaris TWA.
#
# NOTE: this only works once the Gradle project has been scaffolded with
#   `bubblewrap init --manifest ./twa-manifest.json`
# (the scaffolded outputs are gitignored, so `bubblewrap build` regenerates /
# validates them here). Until that first scaffold + native source land, this
# workflow is a starting point — treat a red run before scaffolding as expected.
#
# The debug build proves the project COMPILES. It is not a release.
# A release-signed build needs the keystore from a CI secret; that step is
# guarded so forks / secret-less runs still pass on the debug build.

name: android-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      # Debug / unsigned build — validates that the project builds.
      - name: Build (debug, unsigned)
        run: bubblewrap build --skipPwaValidation

      # Release-signed build — only when the keystore secret is present.
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build (release, signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solaris-android-build
          path: |
            *.apk
            *.aab
          if-no-files-found: ignore
